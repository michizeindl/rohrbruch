<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E63B5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rohrbruch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rohrbruch – Muster Haustechnik</title>
<!-- Startseite mit Stufenwahl „Figur im Lichtkreis“ (MZ, 27.10.2026; vorher Heizungsverteiler, archiviert in
     Material/Archiv/startseite-verteiler-2026-10-27/). App-Icon Variante 2 (gebrochenes o mit Firmenzeichen),
     Intro „Das Rohr gibt nach“, Musik der Sammlung. Aufbau: start/start.css, start/start.js, start/intro.js -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="schrift/barlow.css">
<link rel="stylesheet" href="start/start.css">
<!-- Kundendaten früh laden: Intro und Farben brauchen sie vor dem ersten Bild -->
<script src="kunde/kunde.js"></script>
<script>
// Kundenfarbe sofort setzen; Intro nur beim ersten Öffnen in dieser Sitzung (Testhilfe #intro, Standbild #intro=1.4)
(function () {
  var K = window.KUNDE || {}, f = K.farben || {}, d = document.documentElement, gesehen = false;
  d.style.setProperty('--haupt', f.haupt || '#1E63B5');
  d.style.setProperty('--dunkel', f.dunkel || '#0f2f57');
  if (f.haupt) document.querySelector('meta[name="theme-color"]').setAttribute('content', f.haupt);
  try { gesehen = sessionStorage.getItem('mg:intro:rohrbruch:' + (K.firma || '')) === '1'; } catch (e) { /* privat */ }
  if (/(?:^#|&)intro(?![a-z])/.test(location.hash) || !gesehen) d.classList.add('intro');
})();
</script>
</head>
<body>
<div class="seite" id="seite">
  <header class="kopf">
    <div class="logo ein" id="logo" role="img"></div>
    <button class="ton ein" id="tonKnopf" type="button" aria-label="Ton an/aus"></button>
  </header>
  <section class="titel">
    <h1 class="schriftzug ein" id="schriftzug" aria-label="Rohrbruch!"></h1>
    <!-- Gesamt-Bestwert ersatzlos entfernt (MZ, 25.10.2026, bewusste Ausnahme von der Regel „Gesamt-Bestwert oben“) -->
  </section>
  <!-- Stufenwahl „Figur im Lichtkreis“ (MZ, 27.10.2026, Skizze B; Grad-Pille links neben der Figur = B1): immer eine Stufe,
       Pfeile/Wischen/Pfeiltasten wechseln, „An die Arbeit“ oder Antippen der Figur startet sie -->
  <section class="wahl" id="wahl" aria-roledescription="Karussell" aria-label="Stufe wählen">
    <div class="wahl-name stapel ein" id="wahlName"></div>
    <div class="buehne ein" id="buehne">
      <div class="folien" id="folien"></div>
      <div class="grad-stapel stapel" id="gradStapel"></div>
      <button class="pfeil zurueck" id="pfeilZurueck" type="button" aria-label="Vorherige Stufe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg></button>
      <button class="pfeil vor" id="pfeilVor" type="button" aria-label="Nächste Stufe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
    </div>
    <div class="wahl-best stapel ein" id="wahlBest"></div>
    <a class="los ein" id="losKnopf" href="shk-adventure/#stufe=azubi">An die Arbeit</a>
    <div class="punkte ein" id="punkte" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="nur-vorlesen" id="ansage" aria-live="polite"></p>
  </section>
  <!-- Einsatzbuch-Ansicht im Spielordner (#buch), „Zum Menü“ führt hierher zurück -->
  <a class="buch ein" id="buchKnopf" href="shk-adventure/#buch">
    <svg class="buch-zeichen" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v16H7.5A1.5 1.5 0 0 0 6 19.5 1.5 1.5 0 0 0 7.5 21H19v1H7.5A2.5 2.5 0 0 1 5 19.5z"/><path d="M9 6h7v1.6H9zM9 9h5v1.6H9z" fill="var(--haupt)"/></svg>
    <span>Einsatzbuch</span><b><span id="buch">0</span>/100</b>
  </a>
  <footer class="fuss ein" id="fuss"></footer>
</div>
<script src="schrift/schriftzug.js"></script>
<!-- Figuren der Stufen (Maße, Brustfläche fürs Firmenzeichen) – dieselben Daten wie im Zwischenbild des Spiels -->
<script src="shk-adventure/stufenfiguren.js"></script>
<script src="start/start.js"></script>
<script src="start/intro.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
